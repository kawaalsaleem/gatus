# Namespace for the monitoring stack
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
# ConfigMap for Gatus configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: monitoring
data:
  config.yaml: |
    metrics: true
    endpoints:
      - name: website
        url: https://twin.sh/health
        interval: 5m
        conditions:
          - "[STATUS] == 200"

      - name: example
        url: https://example.com/
        interval: 5m
        conditions:
          - "[STATUS] == 200"

      - name: github
        url: https://api.github.com/healthz
        interval: 5m
        conditions:
          - "[STATUS] == 200"

      - name: check-domain-expiration
        url: "https://example.org/"
        interval: 1h
        conditions:
          - "[DOMAIN_EXPIRATION] > 720h"
---
# ConfigMap for Prometheus configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    scrape_configs:
      - job_name: gatus
        scrape_interval: 10s
        static_configs:
          - targets:
              - gatus:8080
---
# ConfigMap for Grafana configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: monitoring
data:
  grafana.ini: |
    [paths]

    [server]

    [database]

    [session]

    [dataproxy]

    [analytics]
    reporting_enabled = false

    [security]

    [snapshots]

    [dashboards]

    [users]
    allow_sign_up = false
    default_theme = light

    [auth]

    [auth.anonymous]
    enabled = true
    org_name = Main Org.
    org_role = Admin

    [auth.github]

    [auth.google]

    [auth.generic_oauth]

    [auth.grafana_com]

    [auth.proxy]

    [auth.basic]

    [auth.ldap]

    [smtp]

    [emails]

    [log]
    mode = console

    [log.console]

    [log.file]

    [log.syslog]

    [alerting]

    [explore]

    [metrics]
    enabled = true

    [metrics.graphite]

    [tracing.jaeger]

    [grafana_com]

    [external_image_storage]

    [external_image_storage.s3]

    [external_image_storage.webdav]

    [external_image_storage.gcs]

    [external_image_storage.azure_blob]

    [external_image_storage.local]

    [rendering]

    [enterprise]
---
# ConfigMap for Grafana datasource provisioning
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  prometheus.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        version: 1
        editable: false
---
# ConfigMap for Grafana dashboard provisioning
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  dashboard.yml: |
    apiVersion: 1

    providers:
      - name: 'Prometheus'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards
---
